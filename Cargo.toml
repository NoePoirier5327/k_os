[package]
name = "k_os"
version = "0.1.0"
edition = "2021"

[profile.release]
debug = true

[lib]
name = "k_os"
path = "kernel/lib.rs"
crate-type = ["staticlib"]
test = false
doctest = false

[dependencies]
goblin = { version = "0.10.7", default-features = false, features = ["elf64", "elf32", "endian_fd"] }
linked_list_allocator = "0.10.6"
multiboot2 = {version = "0.24.1", default-features = false}
pc-keyboard = {version = "0.9.0"}
pic8259 = {version = "0.11.0"}
spin = {version = "0.10.0"}
volatile = {version = "0.2.6"}
x86_64 = {version = "0.15.4"}
